<!doctype html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Knižnica</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="knihy.js" defer></script>
</head>
<body>
    <!-- Контейнер для верхнего меню (путеводителя) -->
    <div id="topbar-container"></div>

    <main>
        <h1>Moja knižnica</h1>
        <form id="formular">
            <input id="nazov" placeholder="Názov knihy" required>
            <input id="autor" placeholder="Autor" required>
            <input id="rok" type="number" placeholder="Rok" required>
            <input id="cena" type="number" step="0.01" min="0" placeholder="Cena (€)" required>
            <button>Pridať knihu</button>
        </form>
        
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Názov</th>
                    <th>Autor</th>
                    <th>Rok</th>
                    <th>Cena (€)</th>
                    <th>Akcia</th>
                </tr>
            </thead>
            <tbody id="zoznam"></tbody>
        </table>
    </main>

    <!-- Скрипт для автоматической загрузки topbar.html -->
    <script>
        fetch('topbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('topbar-container').innerHTML = data;
            });
    </script>
</body>
</html>
